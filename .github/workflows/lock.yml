name: Update

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: |-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

on:
  pull_request:
    branches:
      - main
      - epic/*
    paths:
      - .pre-commit-config.yaml
      - uv.lock
  workflow_dispatch:

jobs:
  lock:
    uses: ComPWA/actions/.github/workflows/lock.yml@244cbdc9ef919cf659fcf26abeb04d6da39434ac # 4.1.1
    secrets:
      token: ${{ secrets.PAT }}
