name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: |-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

on:
  push:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
    tags:
      - "*"
  pull_request:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  workflow_dispatch:

jobs:
  doc:
    uses: ComPWA/actions/.github/workflows/ci-docs.yml@073b457f12323b97cc0f8ef647d7409a25b61d64 # readthedocs-upload
    permissions:
      pages: write
      id-token: write
    with:
      apt-packages: graphviz
      readthedocs-upload: true
    secrets:
      readthedocs-token: ${{ secrets.READTHEDOCS_TOKEN }}
  style:
    secrets:
      token: ${{ secrets.PAT }}
    uses: ComPWA/actions/.github/workflows/style.yml@eadda724984c78a55a6acb4dcdbb2167fb5eba03 # v4.2.1
  test:
    uses: ComPWA/actions/.github/workflows/test.yml@eadda724984c78a55a6acb4dcdbb2167fb5eba03 # v4.2.1
    with:
      coverage-python-version: "3.14"
      macos-python-version: "3.13"
      test-output-path: tests/output/
